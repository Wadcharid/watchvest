name: Update Watchlist Market Data

on:
  schedule:
    # ทุก 30 นาที ในช่วงวันทำการตลาดเอเชียและสหรัฐฯ (วันจันทร์-ศุกร์ 09:00 - 04:00 น. ตามเวลาไทย)
    - cron: '*/30 2-21 * * 1-5'
    # ทุก 2 ชั่วโมง ในช่วงวันหยุดสุดสัปดาห์ สำหรับตลาด Crypto (BTC)
    - cron: '0 */2 * * 0,6'
  workflow_dispatch: # เปิดให้กดปุ่มสั่ง Run ได้ตลอดเวลา
  push:
    paths:
      - 'data/watchlist.json'
    branches:
      - main

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Market Data & Calculate Indicators
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --staged --quiet || (git commit -m "Update stock data and RSI indicators via TradingView feed [skip ci]" && git push)
